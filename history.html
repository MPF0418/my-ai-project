<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 通用文案生成器</title>
    <link rel="stylesheet" href="marketing-copywriter.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>历史记录</h1>
                <button id="back-btn" class="back-button">返回</button>
            </div>
            <div class="skin-selector">
                <label>皮肤:</label>
                <select id="skin-select">
                    <option value="default">默认</option>
                    <option value="dark">深色</option>
                    <option value="light">浅色</option>
                    <option value="colorful">多彩</option>
                </select>
            </div>
        </header>
        
        <main>
            <section class="tool-section">
                <div class="tool-content">
                    <div class="history-search">
                        <input type="text" id="history-search" placeholder="搜索历史记录...">
                        <button id="clear-history-btn">清空历史</button>
                    </div>
                    <div id="history-list"></div>
                    <div id="empty-history" style="display: none;">
                        <p>暂无历史记录</p>
                    </div>
                </div>
            </section>
        </main>
        
        <footer>
            <p>© 2026 通用文案生成器</p>
        </footer>
    </div>
    <script src="config.js"></script>
    <script src="history.js"></script>
</body>
</html>
